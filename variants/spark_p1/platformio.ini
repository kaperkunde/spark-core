; SparkNode: MeshCore room server + relay for the SenseCAP Solar Node P1, with HostLink (see spark/).
; Kept in its own variant directory so no upstream ini file is edited; the root
; platformio.ini picks this file up through its `extra_configs = variants/*/platformio.ini` glob.
; Name, passwords, radio, scope, path hash and BLE PIN come from the repository's .env
; (spark/pio_env.py; .env.example documents the keys).

[env:SparkNode_P1]
extends = SenseCap_Solar
extra_scripts = ${nrf52_base.extra_scripts}
  pre:spark/pio_env.py
custom_spark_component = node
; extrafs linker script: app region ends at 0xD4000, the 100 KB below InternalFS (0xED000)
; holds the room post store. InternalFS (identity, prefs, ACL) is not moved.
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${SenseCap_Solar.build_flags}
  -I examples/spark_room
  -D FIRMWARE_VERSION='"v1.18.0-SparkNode1"'
  -D WITH_HOSTLINK=1
  -D HOSTLINK_BLE=1
  -D ROOM_PERSIST_POSTS=1
  -D ROOM_ALLOW_REPEAT_TOGGLE=1
  -D ROOM_MEMBER_DIR=1
build_src_filter = ${SenseCap_Solar.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/simple_room_server/*.cpp>
  +<../examples/spark_room/*.cpp>

; Unit tests for the pure parts (frame codec, post file codec, USB frame parser, member
; directory). The test files include the .cpp units themselves.
[env:native_spark]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D SPARK_NATIVE_TEST=1
  -I src
  -I test/mocks
  -I examples/spark_room
test_build_src = yes
test_filter =
  test_spark_hostlink
  test_spark_members
build_src_filter =
  -<*>
lib_deps =
  google/googletest @ 1.17.0
