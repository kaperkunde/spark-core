; SparkKids: one-room MeshCore messenger for the LilyGO T-Deck Plus (touch, keyboard, GPS).
; One room (your SparkNode), its members, DMs and an optional Public channel. See examples/spark_kids.
; Kept in its own variant directory so no upstream ini file is edited.
; Room key, room password, parent PIN, radio, scope and Public channel default come from the
; repository's .env (spark/pio_env.py; .env.example documents the keys).

[env:SparkKids_TDeckPlus]
extends = LilyGo_TDeck
extra_scripts = ${esp32_base.extra_scripts}
  pre:spark/pio_env.py
custom_spark_component = kids
build_flags =
  -I variants/spark_tdeck
  ${LilyGo_TDeck.build_flags}
  -UDISPLAY_CLASS
  -I examples/spark_room
  -I examples/spark_kids
  -D PIN_SD_CS=39
  -D MAX_CONTACTS=40
  -D KIDS_FW_VERSION='"SparkKids1 (MeshCore v1.18.0)"'
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck/TDeckBoard.cpp>
  +<../variants/spark_tdeck>
  +<../examples/spark_kids/*.cpp>
  +<../examples/spark_room/MemberDir.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
